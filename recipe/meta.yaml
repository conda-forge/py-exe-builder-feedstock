{% set name = "py-exe-builder" %}
{% set version = "0.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  #url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/py-exe-builder-{{ version }}.tar.gz
  url: https://github.com/j5int/py-exe-builder/archive/v{{ version }}.tar.gz
  sha256: 9036be013846112130f81cf51e28279944dda7d7c729219d30b8bea380727903
  
build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  #Not yet ready for Python 3.11
  number: 0
  noarch: python

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - py2exe 
    - python >={{ python_min }}
    - __win   # [win]

test:
  imports:
    - pyexebuilder
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/j5int/py-exe-builder
  summary: Uses py2exe to create small exe stubs that leverage a full python installation, rather than packing the required pyc files in to the executable.
  license: Apache-2.0
  license_file: LICENSE
  dev_url: https://github.com/j5int/py-exe-builder

extra:
  recipe-maintainers:
    - HeavyTony2
